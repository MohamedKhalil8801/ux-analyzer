id: attention-guided-demo
name: Attention-guided UI agent demo

applications:
  - id: fixture-app
    name: Controlled SaaS fixture
    versions:
      - id: fixture-app-defective
        kind: defective
        label: Defective
      - id: fixture-app-improved
        kind: improved
        label: Improved

scenarios:
  - id: invite-teammate
    name: Invite teammate
    goal: Invite teammate to workspace
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    start_state: dashboard
    fixture_inputs:
      invite_email:
        value: demo-invite@example.test
        sensitive: true
      invite_role:
        value: member
        sensitive: false
    budget:
      max_steps: 24
      max_observations: 12
      max_interactions: 10
      timeout_seconds: null
    verifier:
      type: fixture-state
      resource: workspace
      field: invited_email
      operator: equals
      expected_fixture_key: invite_email
    safeguards:
      - fixture-only
      - test-account-only
      - no-outbound-communication
    eligible_persona_ids:
      - first-time-nontechnical
      - impatient
    expected_evidence:
      - target-discovery
      - information-scent
      - verified-completion
    evaluation_target:
      labels_by_version:
        defective: Share
        improved: Invite teammate
      roles_by_version:
        defective: button
        improved: link

  - id: enable-2fa
    name: Enable two-factor authentication
    goal: Enable two-factor authentication
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    start_state: settings
    fixture_inputs:
      totp_code:
        value: "246810"
        sensitive: true
    budget:
      max_steps: 24
      max_observations: 12
      max_interactions: 10
      timeout_seconds: null
    verifier:
      type: fixture-state
      resource: security
      field: two_factor_enabled
      operator: truthy
      expected_fixture_key: totp_code
    safeguards:
      - fixture-only
      - test-account-only
      - no-outbound-communication
    eligible_persona_ids:
      - first-time-nontechnical
      - impatient
    expected_evidence:
      - target-discovery
      - hierarchy-depth
      - verified-completion
    evaluation_target:
      labels_by_version:
        defective: Enable protection
        improved: Enable two-factor authentication
      role: button

personas:
  - id: first-time-nontechnical
    name: First-time nontechnical user
    working_memory_capacity: 4
    initial_confidence: 0.55
    initial_frustration: 0.10
    abandonment_threshold: 0.72
    attention_temperature: 1.15
  - id: impatient
    name: Impatient user
    working_memory_capacity: 3
    initial_confidence: 0.60
    initial_frustration: 0.18
    abandonment_threshold: 0.55
    attention_temperature: 0.85

providers:
  prominence:
    version: heuristic-prominence-v1
    temperature: 1.0
    weights:
      area: 0.16
      center_distance: 0.14
      reading_order: 0.10
      typography: 0.12
      contrast: 0.12
      isolation: 0.10
      actionability: 0.14
      motion: 0.05
      competition: -0.08
      occlusion: -0.09
  attention:
    version: progressive-attention-v4
    batch_size: 2
    cross_region_exploration: 1
    prominence_weight: 1.0
    coarse_scent_weight: 1.0
    novelty_penalty: 0.25
    failure_penalty: 0.5
    recovery_scent_threshold: 0.9
    recovery_after_misses: 2
  expectation:
    enabled: true
    provider_id: frozen-expectation-v1
    documents:
      - id: fixture-defective-invite-teammate-v1
        schema_version: frozen-expectation-v1
        application_version_id: fixture-app-defective
        scenario_id: invite-teammate
        persona_id: "*"
        desired_outcomes:
          - The supplied teammate is invited to the workspace.
        required_invariants:
          - The invitee remains a workspace member.
          - No outbound communication is required.
        acceptable_alternatives:
          - Use the dashboard invitation entry.
          - Use the workspace team settings entry.
        reference_paths:
          - [dashboard, invite]
          - [dashboard, settings, team, invite]
        effort_bounds:
          max_steps: 24
          max_wrong_actions: 1
          max_backtracks: 1
        warning_signals:
          - The invitation control uses a broad or ambiguous action label.
          - The invitation control is absent from the first useful view.
      - id: fixture-improved-invite-teammate-v1
        schema_version: frozen-expectation-v1
        application_version_id: fixture-app-improved
        scenario_id: invite-teammate
        persona_id: "*"
        desired_outcomes:
          - The supplied teammate is invited to the workspace.
        required_invariants:
          - The invitee remains a workspace member.
          - No outbound communication is required.
        acceptable_alternatives:
          - Use the primary invite teammate action.
          - Use the workspace team settings entry.
        reference_paths:
          - [dashboard, invite-teammate]
          - [dashboard, settings, team, invite]
        effort_bounds:
          max_steps: 24
          max_wrong_actions: 1
          max_backtracks: 1
        warning_signals:
          - The primary invitation action is not visible in the first useful view.
      - id: fixture-defective-enable-2fa-v1
        schema_version: frozen-expectation-v1
        application_version_id: fixture-app-defective
        scenario_id: enable-2fa
        persona_id: "*"
        desired_outcomes:
          - Two-factor authentication is enabled for the account.
        required_invariants:
          - The configured verification code is used only in the fixture.
          - Completion is independently verified by fixture state.
        acceptable_alternatives:
          - Use the account security entry.
          - Use the settings security entry.
        reference_paths:
          - [settings, security, enable-protection]
          - [account, security, two-factor]
        effort_bounds:
          max_steps: 24
          max_wrong_actions: 1
          max_backtracks: 1
        warning_signals:
          - The two-factor control uses a broad or ambiguous protection label.
          - Security settings are hidden behind an unexpected navigation branch.
      - id: fixture-improved-enable-2fa-v1
        schema_version: frozen-expectation-v1
        application_version_id: fixture-app-improved
        scenario_id: enable-2fa
        persona_id: "*"
        desired_outcomes:
          - Two-factor authentication is enabled for the account.
        required_invariants:
          - The configured verification code is used only in the fixture.
          - Completion is independently verified by fixture state.
        acceptable_alternatives:
          - Use the account security entry.
          - Use the settings security entry.
        reference_paths:
          - [settings, security, two-factor]
          - [account, security, two-factor]
        effort_bounds:
          max_steps: 24
          max_wrong_actions: 1
          max_backtracks: 1
        warning_signals:
          - The two-factor control is not visible from the first useful security view.

evaluation:
  discovery_cost:
    version: discovery-cost-v1
    inspection_cost: 1.0
    region_cost: 1.0
    scroll_cost: 1.0
    wrong_action_cost: 1.0
    backtrack_cost: 1.0
    uncertainty_cost: 1.0
    abandonment_penalty: 1.0
  findings:
    version: finding-rules-v1
    weak_target_prominence_below: 0.25
    weak_scent_below: 0.30
    misleading_scent_margin: 0.20
    excessive_navigation_depth_at_least: 4
    wrong_action_count_at_least: 2
  state_updates:
    version: state-updates-v1
    success_confidence_delta: 0.05
    success_frustration_delta: -0.10
    failure_confidence_delta: -0.10
    failure_frustration_delta: 0.20
  report_synthesis:
    enabled: true

experiments:
  - id: core-pair
    name: Core unrestricted versus progressive attention pair
    scenario_ids:
      - invite-teammate
      - enable-2fa
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    persona_ids:
      - first-time-nontechnical
    policies:
      - full-list
      - progressive-prominence-scent
    model_trials:
      - 0
    run_count: 1
  - id: ablations
    name: Attention policy ablations
    scenario_ids:
      - invite-teammate
      - enable-2fa
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    persona_ids:
      - first-time-nontechnical
    policies:
      - prominence-ranked-list
      - progressive-prominence
    model_trials:
      - 0
    run_count: 1
  - id: baseline-model-trials
    name: Invite teammate baseline model-trial replication
    scenario_ids:
      - invite-teammate
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    persona_ids:
      - first-time-nontechnical
    policies:
      - full-list
      - progressive-prominence-scent
    seeds:
      - 0
    model_trials:
      - 0
      - 1
    run_count: 1
  - id: focused-validation
    name: Focused defective versus improved validation
    scenario_ids:
      - invite-teammate
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    persona_ids:
      - first-time-nontechnical
    policies:
      - full-list
      - progressive-prominence-scent
    seeds:
      - 0
    run_count: 1
  - id: saliency-focused-validation
    name: Focused heuristic versus Foveacast saliency validation
    scenario_ids:
      - invite-teammate
      - enable-2fa
    application_version_ids:
      - fixture-app-defective
      - fixture-app-improved
    persona_ids:
      - first-time-nontechnical
    prominence_provider_ids:
      - heuristic
      - foveacast
    policies:
      - progressive-prominence-scent
    seeds:
      - 0
    model_trials:
      - 0
    run_count: 1
