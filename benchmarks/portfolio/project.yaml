id: portfolio-benchmark
name: Mohamed Khalil live portfolio benchmark

applications:
  - id: portfolio
    name: Mohamed Khalil public portfolio
    versions:
      - id: portfolio-live
        kind: live
        label: Production
        start_url: https://mohamed-khalil.vercel.app
        allowed_origins:
          - https://fonts.googleapis.com
          - https://fonts.gstatic.com
        navigation_settle_ms: 2400
        action_settle_ms: 2800

scenarios:
  - id: current-pair-role
    name: Current PAIR role and frontend stack
    goal: Find Mohamed's current employer, role, and primary web frontend technologies.
    application_version_ids:
      - portfolio-live
    start_state: home
    budget:
      max_steps: 60
      max_observations: 30
      max_interactions: 24
      max_model_calls: 40
      timeout_seconds: null
    verifier:
      type: visible-result
      text: Frontend Engineer
      all_of:
        - PAIR Systems
        - React
        - TypeScript
    safeguards:
      - public-target-only
      - visible-result-only
      - no-fixture-state
      - no-outbound-communication
    eligible_persona_ids:
      - first-time-nontechnical
    expected_evidence:
      - target-discovery
      - visible-result
      - verified-completion
    evaluation_target:
      labels_by_version:
        live: PAIR Systems
      role: link
    viewport:
      width: 1440
      height: 900

  - id: open-prayer-times-scale
    name: Open Prayer Times coverage
    goal: Find stated city and country coverage for Mohamed's open-source prayer-time project.
    application_version_ids:
      - portfolio-live
    start_state: home
    budget:
      max_steps: 60
      max_observations: 30
      max_interactions: 24
      max_model_calls: 40
      timeout_seconds: null
    verifier:
      type: visible-result
      text: 48,000+
      all_of:
        - cities calibrated
        - 130+
        - countries
    safeguards:
      - public-target-only
      - visible-result-only
      - no-fixture-state
      - no-outbound-communication
    eligible_persona_ids:
      - first-time-nontechnical
    expected_evidence:
      - target-discovery
      - visible-result
      - verified-completion
    evaluation_target:
      labels_by_version:
        live: Open Prayer Times
      role: link
    viewport:
      width: 1440
      height: 900

  - id: contact-remote-role
    name: Contact for remote frontend role
    goal: Find Mohamed's public email address and whether he is open to remote frontend work.
    application_version_ids:
      - portfolio-live
    start_state: home
    budget:
      max_steps: 60
      max_observations: 30
      max_interactions: 24
      max_model_calls: 40
      timeout_seconds: null
    verifier:
      type: visible-result
      text: m.khalil.bus@gmail.com
      all_of:
        - Open to mobile and web roles
        - open to remote
    safeguards:
      - public-target-only
      - visible-result-only
      - no-fixture-state
      - no-outbound-communication
    eligible_persona_ids:
      - first-time-nontechnical
    expected_evidence:
      - target-discovery
      - visible-result
      - verified-completion
    evaluation_target:
      labels_by_version:
        live: Contact
      role: link
    viewport:
      width: 1440
      height: 900

personas:
  - id: first-time-nontechnical
    name: First-time nontechnical portfolio visitor
    working_memory_capacity: 4
    initial_confidence: 0.55
    initial_frustration: 0.10
    abandonment_threshold: 0.72
    attention_temperature: 1.15

providers:
  attention:
    batch_size: 3
    cross_region_exploration: 1
  saliency:
    model_set:
      - foveacast-v0.2.0
    fallback:
      enabled: false
      provider_id: heuristic
  expectation:
    enabled: true
    provider_id: frozen-expectation-v1
    documents:
      - id: portfolio-current-pair-role-v1
        schema_version: frozen-expectation-v1
        application_version_id: portfolio-live
        scenario_id: current-pair-role
        persona_id: first-time-nontechnical
        desired_outcomes:
          - The visitor identifies the current employer, role, and primary frontend technologies.
        required_invariants:
          - Claims are supported by visible portfolio content.
          - No contact or outbound action is required.
        acceptable_alternatives:
          - Use the primary work or about navigation entry.
          - Use a visible project or experience section.
        reference_paths:
          - [home, about, experience]
          - [home, work, project, stack]
        effort_bounds:
          max_steps: 60
          max_wrong_actions: 2
          max_backtracks: 2
        warning_signals:
          - Employer, role, or stack information is not visible on the first useful route.
      - id: portfolio-open-prayer-times-scale-v1
        schema_version: frozen-expectation-v1
        application_version_id: portfolio-live
        scenario_id: open-prayer-times-scale
        persona_id: first-time-nontechnical
        desired_outcomes:
          - The visitor finds the stated city and country coverage for Open Prayer Times.
        required_invariants:
          - Coverage claims are supported by visible portfolio content.
          - No external service or outbound action is required.
        acceptable_alternatives:
          - Use the projects navigation entry.
          - Use the Open Prayer Times project detail.
        reference_paths:
          - [home, projects, open-prayer-times]
          - [home, work, open-prayer-times, coverage]
        effort_bounds:
          max_steps: 60
          max_wrong_actions: 2
          max_backtracks: 2
        warning_signals:
          - Coverage scale is hidden behind a route that does not identify the project.
      - id: portfolio-contact-remote-role-v1
        schema_version: frozen-expectation-v1
        application_version_id: portfolio-live
        scenario_id: contact-remote-role
        persona_id: first-time-nontechnical
        desired_outcomes:
          - The visitor finds the public email address and remote-work availability.
        required_invariants:
          - Contact details and availability are supported by visible portfolio content.
          - The scenario does not send a message.
        acceptable_alternatives:
          - Use the contact navigation entry.
          - Use the visible availability or footer contact entry.
        reference_paths:
          - [home, contact]
          - [home, about, availability, contact]
        effort_bounds:
          max_steps: 60
          max_wrong_actions: 2
          max_backtracks: 2
        warning_signals:
          - Contact information or remote availability is not discoverable from a visible route.

evaluation:
  report_synthesis:
    enabled: true

experiments:
  - id: portfolio-foveacast-vs-heuristic
    name: Portfolio FoveaCast versus heuristic prominence
    scenario_ids:
      - current-pair-role
      - open-prayer-times-scale
      - contact-remote-role
    application_version_ids:
      - portfolio-live
    persona_ids:
      - first-time-nontechnical
    prominence_provider_ids:
      - heuristic
      - foveacast
    policies:
      - progressive-prominence
    seeds:
      - 0
    model_trials:
      - 0
    run_count: 1
