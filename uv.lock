[[package]]
name = "ux-analyzer"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "httpx" },
    { name = "jinja2" },
    { name = "numpy" },
    { name = "pillow" },
    { name = "platformdirs" },
    { name = "playwright" },
    { name = "pydantic" },
    { name = "python-dotenv" },
    { name = "pyyaml" },
    { name = "typer" },
    { name = "uvicorn" },
]

[package.optional-dependencies]
saliency-cpu = [
    { name = "onnxruntime" },
]
saliency-directml = [
    { name = "onnxruntime-directml" },
]

[package.dev-dependencies]
dev = [
    { name = "pyright" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.112" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "jinja2", specifier = ">=3.1" },
    { name = "numpy", specifier = ">=2.1" },
    { name = "onnxruntime", marker = "extra == 'saliency-cpu'", specifier = ">=1.19,<2" },
    { name = "onnxruntime-directml", marker = "extra == 'saliency-directml'", specifier = ">=1.19,<2" },
    { name = "pillow", specifier = ">=10.4" },
    { name = "platformdirs", specifier = ">=4.3" },
    { name = "playwright", specifier = ">=1.46" },
    { name = "pydantic", specifier = ">=2.8" },
    { name = "python-dotenv", specifier = ">=1.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "typer", specifier = ">=0.12" },
    { name = "uvicorn", specifier = ">=0.30" },
]
provides-extras = ["saliency-cpu", "saliency-directml"]

[package.metadata.requires-dev]
dev = [
    { name = "pyright", specifier = ">=1.1.390" },
    { name = "pytest", specifier = ">=8.3" },
