<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title|default("Northstar workspace") }}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/app/{{ session_id }}/{{ version }}">Northstar</a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="/app/{{ session_id }}/{{ version }}">Overview</a>
        {% if version == "improved" %}
        <a href="/app/{{ session_id }}/{{ version }}/settings">Security</a>
        {% else %}
        <a href="/app/{{ session_id }}/{{ version }}/settings">Settings</a>
        {% endif %}
      </nav>
      <div class="account" data-account-menu>
        <button class="icon-button" type="button" aria-label="Open account menu" data-account-toggle>
          <span aria-hidden="true">NK</span>
        </button>
        <div class="account-menu" data-account-panel hidden>
          <a href="/app/{{ session_id }}/{{ version }}/team">Members</a>
          <a href="/app/{{ session_id }}/{{ version }}/settings">Account settings</a>
        </div>
      </div>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
